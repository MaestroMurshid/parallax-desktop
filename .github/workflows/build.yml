name: "CI Build"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev alsa-utils libasound2-dev

      - name: Typecheck Frontend
        run: npm run typecheck

      - name: Fetch Llama Server (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/fetch-llama.ps1

      - name: Mock Llama Server (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/binaries/llama
          touch src-tauri/binaries/llama/.keep

      - name: Build Tauri App
        run: npm run tauri build
