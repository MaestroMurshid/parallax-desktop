name: "Release"

on:
  push:
    tags:
      - 'v*'

# tauri-action creates the draft release and uploads to it, which a read-only
# GITHUB_TOKEN (the default for new repositories) refuses.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The tag is the version: tauri.conf.json reads it from package.json.
      - name: Version From Tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Tauri downloads NSIS and WiX from GitHub releases, which intermittently
      # answer 504.
      - name: Cache Bundler Tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev alsa-utils libasound2-dev

      - name: Fetch Llama Server (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/fetch-llama.ps1

      - name: Fetch Llama Server (Linux & macOS)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-llama.sh

      - name: Build and Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Parallax ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
