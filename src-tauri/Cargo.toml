[package]
name = "parallax"
version = "0.0.1"
description = "Voice capture that puts your past entries next to your present ones"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.77"

[lib]
name = "parallax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4"] }
cpal = "0.17.1"
hound = "3.5.1"
transcribe-cpp = "0.2.3"
sysinfo = "0.36.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
