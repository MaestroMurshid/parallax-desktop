[package]
name = "parallax"
version = "0.0.1"
description = "Voice capture that puts your past entries next to your present ones"
edition = "2021"
license = "AGPL-3.0-only"
# Option::is_none_or, used in commands/corpus.rs, commands/models.rs and
# state.rs, stabilised in 1.82.0 -- that is the true floor, not 1.77.
rust-version = "1.82"

[lib]
name = "parallax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order is load-bearing, not a nicety. llama.cpp builds its grammar in
# the order a JSON schema lists its fields, and without this serde_json sorts
# them alphabetically -- which put the judge's `question` before its quotes, made
# it unwritable once a quote was written, and dropped every connection.
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4"] }
cpal = "0.17.1"
hound = "3.5.1"
transcribe-cpp = "0.2.3"
sysinfo = "0.36.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
rust-stemmers = "1.2.0"
# Already in the tree through reqwest; named directly for `url::Host`, which is
# how an endpoint on this machine is told apart from one that is not.
url = "2"
tauri-plugin-dialog = "2"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

# API keys for cloud reasoning providers live in the OS credential store, never
# in the settings document: that is a plain JSON row in corpus.db, and the
# corpus is exactly the thing people export, back up and hand around.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

# zbus rather than libdbus: pure Rust, so the Linux build needs no extra system
# package beyond what CI already installs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
